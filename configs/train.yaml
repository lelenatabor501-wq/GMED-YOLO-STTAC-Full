# GMED-YOLO training configuration
# Reproduces the detector-training settings reported in the manuscript
# and is loaded by train_gmed_yolo.py.
#
# Random seeds are prespecified separately in ../seeds.txt and should be
# supplied one at a time for the five independent runs.

# Model and dataset
model: models/gmed-yolo.yaml
data: configs/apple-defect.yaml
task: detect

# Training
imgsz: 640
epochs: 200
batch: 16
optimizer: SGD
lr0: 0.01
momentum: 0.937
weight_decay: 0.0005

# Reproducibility / augmentation settings
deterministic: true
pretrained: false
close_mosaic: 0
amp: false

# Data loading
workers: 8
cache: false

# Output
project: runs/train
name: gmed-yolo
