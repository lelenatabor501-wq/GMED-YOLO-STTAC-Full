# GMED-YOLO detector used in the manuscript.
# Full model: all GMED fusion paths and CSPOmniKernel are enabled.

nc: 4
end2end: True
reg_max: 1
scale: n
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4

  # GMED: generate Edge_P3, Edge_P4, and Edge_P5 from P2.
  - [-1, 1, MultiScaleEdgeInfoGenerator, [[128, 256, 512]]] # 3
  - [3, 1, SelectScale, [0]] # 4 Edge_P3
  - [3, 1, SelectScale, [1]] # 5 Edge_P4
  - [3, 1, SelectScale, [2]] # 6 Edge_P5

  # First GMED fusion path: ConvEdgeFusion at the neck inputs.
  - [2, 1, Conv, [256, 3, 2]] # 7-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 8
  - [[4, 8], 1, ConvEdgeFusion, [512]] # 9
  - [9, 1, Conv, [512, 3, 2]] # 10-P4/16
  - [-1, 2, C3k2, [512, True]] # 11
  - [[5, 11], 1, ConvEdgeFusion, [512]] # 12
  - [12, 1, Conv, [1024, 3, 2]] # 13-P5/32
  - [-1, 2, C3k2, [1024, True]] # 14
  - [[6, 14], 1, ConvEdgeFusion, [1024]] # 15
  - [15, 1, SPPF, [1024, 5, 3, True]] # 16
  - [-1, 2, C2PSA, [1024]] # 17

head:
  - [17, 1, nn.Upsample, [None, 2, "nearest"]] # 18
  - [[-1, 12], 1, Concat, [1]] # 19
  - [-1, 2, C3k2, [512, True]] # 20

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 21
  - [2, 1, SPDConv, [256]] # 22 O2: lossless P2-to-P3 downsampling
  - [[-1, -2, 9], 1, Concat, [1]] # 23 O2 + upsampled semantics + O1
  - [-1, 1, CSPOmniKernel, []] # 24 CSPOKM
  - [-1, 2, C3k2, [256, True]] # 25 P3

  - [-1, 1, Conv, [256, 3, 2]] # 26
  - [[-1, 20], 1, Concat, [1]] # 27
  - [-1, 2, C3k2, [512, True]] # 28 P4
  - [-1, 1, Conv, [512, 3, 2]] # 29
  - [[-1, 17], 1, Concat, [1]] # 30
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 31 P5

  # Second GMED fusion path: Skip-CEF immediately before Detect.
  - [[4, 25], 1, SkipConvEdgeFusion, [256]] # 32 P3
  - [[5, 28], 1, SkipConvEdgeFusion, [512]] # 33 P4
  - [[6, 31], 1, SkipConvEdgeFusion, [1024]] # 34 P5
  - [[32, 33, 34], 1, Detect, [nc]] # 35
